name: Sovereign AI Stack CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: offline
      DATABASE_URL: sqlite:///data/sovereign.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Type-check with mypy
        run: uv run mypy contracts dataset services evals tests

      - name: Seed database
        run: uv run python -m dataset.seed

      - name: Run pytest suite
        run: uv run pytest -v

      - name: Run offline golden evals
        run: uv run python -m evals.runner --models offline/planner-v1 offline/baseline-lite

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/

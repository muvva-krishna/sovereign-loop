version: "1.0"
default_outcome: DENY

# Role-based tool allowlists (enforced at both tools/list discovery and tools/call execution)
role_tools:
  viewer:
    - "erp.get_open_orders"
    - "erp.get_sales_summary"
    - "erp.check_inventory"
    - "erp.get_low_stock_items"
    - "knowledge.search_sops"
    - "knowledge.get_sop_document"
  sales_rep:
    - "erp.get_open_orders"
    - "erp.get_sales_summary"
    - "erp.check_inventory"
    - "erp.get_low_stock_items"
    - "erp.get_distributor_profile"
    - "knowledge.search_sops"
    - "knowledge.get_sop_document"
    - "ops.create_escalation_ticket"
    - "ops.list_tickets"
  manager:
    - "erp.get_open_orders"
    - "erp.get_sales_summary"
    - "erp.check_inventory"
    - "erp.get_low_stock_items"
    - "erp.get_distributor_profile"
    - "erp.create_requisition"
    - "knowledge.search_sops"
    - "knowledge.get_sop_document"
    - "ops.create_escalation_ticket"
    - "ops.list_tickets"
    - "ops.send_ops_alert"
  admin:
    - "*"

# Deterministic rules evaluated top-to-bottom before any MCP tool call executes
rules:
  - id: "R-001"
    description: "Deny cross-tenant data access when explicit tenant_id argument mismatches caller tenant"
    match:
      arg_mismatch:
        field: "tenant_id"
        must_equal: "caller.tenant_id"
    outcome: DENY
    reason: "Cross-tenant access is strictly forbidden."

  - id: "R-002"
    description: "Agents can never self-approve or reject purchase requisitions via MCP"
    match:
      tool_in:
        - "erp.approve_pending_requisition"
        - "erp.reject_pending_requisition"
    outcome: DENY
    reason: "Human-in-the-loop approvals must occur out-of-band via the authenticated Admin API."

  - id: "R-003"
    description: "Block suspicious SQL injection or destructive argument payloads"
    match:
      forbidden_patterns:
        - "DROP TABLE"
        - "DELETE FROM"
        - "TRUNCATE "
        - "--"
        - ";--"
    outcome: DENY
    reason: "Argument payload triggered deterministic injection guardrail."

  - id: "R-101"
    description: "Purchase requisitions exceeding quantity 10000 are denied outright (hard cap)"
    match:
      tool: "erp.create_requisition"
      numeric_gt:
        field: "quantity"
        threshold: 10000
    outcome: DENY
    reason: "Single requisition quantity exceeds hard ceiling of 10,000 units."

  - id: "R-102"
    description: "Purchase requisitions always enter human approval workflow (never auto-executed)"
    match:
      tool: "erp.create_requisition"
    outcome: REQUIRE_APPROVAL
    reason: "All inventory purchase requisitions require out-of-band human sign-off."

  - id: "R-201"
    description: "Allow remaining tools authorized by role_tools allowlist"
    match:
      role_authorized: true
    outcome: ALLOW
    reason: "Authorized by role allowlist and deterministic policy checks."

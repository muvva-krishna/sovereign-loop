[project]
name = "sovereign-ai-stack"
version = "0.1.0"
description = "Multi-tenant sovereign enterprise AI gateway & MCP orchestration stack with deterministic policies, idempotent writes, hash-chained audit logs, Langfuse tracing, and Harness x Model evals."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.119.0",
    "fastmcp>=2.12.0",
    "httpx>=0.28.0",
    "langfuse>=2.60.0",
    "litellm>=1.65.0",
    "loguru>=0.7.3",
    "mcp>=1.9.4,<2.0.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "redis>=5.2.0",
    "sqlalchemy>=2.0.38",
    "sse-starlette>=2.2.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.3",
    "ruff>=0.9.6",
    "types-PyYAML>=6.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["base", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["base/", ".venv/"]
check_untyped_defs = true
